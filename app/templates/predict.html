{% extends "base.html" %}
{% block content %}
<div class="alert alert-warning" role="note">
  The labels this model learns from are generated by a formula with noise, so it learns that formula. The results
  demonstrate the method and are <strong>not real failure predictions</strong>.
  <details class="mt-1"><summary>How the labels were made</summary><p class="mb-0 small" id="label-source"></p></details>
</div>
<div id="status"></div>
<div id="model-info" class="small text-body-secondary mb-3"></div>
<div class="row g-3 mb-3" id="summary"></div>
<div class="row g-3 mb-3"><div class="col-12 col-xl-5" id="chart"></div></div>
<div class="filters d-flex flex-wrap gap-2 align-items-end mb-2">
  <div><label class="form-label mb-0 small" for="f-risk">Show</label>
    <select class="form-select form-select-sm" id="f-risk"><option value="">All risk classes</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div>
  <div class="ms-auto small text-body-secondary" id="as-of"></div>
</div>
<div id="list"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/plotly.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/predict.js') }}"></script>
{% endblock %}
