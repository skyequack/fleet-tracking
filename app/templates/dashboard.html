{% extends "base.html" %}
{% block content %}
<form id="window-form" class="filters row g-2 align-items-end mb-3" novalidate>
  <div class="col-auto"><label class="form-label mb-0 small" for="from">From</label><input class="form-control form-control-sm" type="date" id="from" name="from"></div>
  <div class="col-auto"><label class="form-label mb-0 small" for="to">To</label><input class="form-control form-control-sm" type="date" id="to" name="to"></div>
  <div class="col-auto"><button class="btn btn-primary btn-sm" type="submit">Apply</button> <button class="btn btn-outline-secondary btn-sm" type="button" id="reset">Last 12 months</button></div>
  <div class="col-12 col-md text-md-end small text-body-secondary" id="window-label"></div>
</form>
<div id="error"></div>
<div class="row g-3 mb-3" id="cards" aria-label="Fleet totals"></div>
<div class="strip mb-3" id="strip" aria-label="Key indicators"></div>
<div class="row g-3" id="charts"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/plotly.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
